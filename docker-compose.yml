services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ridenow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ridenow
      POSTGRES_PASSWORD: ridenow
      POSTGRES_DB: ridenow
    volumes:
      - ridenow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridenow -d ridenow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridenow-pgdata:
